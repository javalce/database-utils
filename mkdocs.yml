site_name: Database Utils
site_url: https://javalce.github.io/database-utils
site_description: Lightweight, extensible Python database utilities. Less boilerplate, same control.

theme:
  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    # - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  icon:
    repo: octicons/mark-github-16
  language: en
repo_name: javalce/database-utils
repo_url: https://github.com/javalce/database-utils

nav:
  - Database Utils: index.md
  - Features: features.md

markdown_extensions:
  # Material for MkDocs
  zensical.extensions.macros:
  # Python markdown
  abbr:
  attr_list:
  footnotes:
  md_in_html:
  tables:
  toc:
    permalink: true

  # Python Markdown Extensions
  pymdownx.betterem:
    smart_enable: true
  pymdownx.caret:
  pymdownx.highlight:
    line_spans: '__span'
    linenums_style: pymdownx-inline
  pymdownx.inlinehilite:
  pymdownx.keys:
  pymdownx.mark:
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.tilde:

  # pymdownx blocks
  pymdownx.blocks.admonition:
  pymdownx.blocks.details:
  pymdownx.blocks.tab:
    alternate_style: true

  # Other extensions
  mdx_include:
  markdown_include_variants:

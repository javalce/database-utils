[project]
name = "database-utils"
version = "0.1.0a2"
description = "Lightweight, extensible Python database utilities. Less boilerplate, same control."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["database"]
authors = [{ name = "Javier Valero Cejudo", email = "javalce29@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

]
dependencies = []

[project.urls]
Homepage = "https://github.com/javalce/database-utils"
Repository = "https://github.com/javalce/database-utils"

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy"]


[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "tests" },
    { include-group = "docs" },
    "sqlalchemy>=2.0.55",
    "pydantic>=2.14.0",
]
docs = [
    "markdown-include-variants>=0.0.8",
    "mdx-include>=1.4.2",
    "mkdocstrings[python]>=1.0.6",
    "zensical>=0.0.67",
]
lint = ["black>=26.10.1", "mypy>=2.4.0", "ruff>=0.17.0"]
tests = [
    "coverage[toml]>=7.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "database_utils.tests.*"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest]
minversion = "9.0"
filterwarnings = ["error", "ignore::sqlalchemy.exc.SAWarning"]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=database_utils",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
strict_xfail = true

[tool.coverage.run]
patch = ["subprocess", "_exit"]
parallel = true
source = ["src/database_utils"]
relative_files = true
context = '${CONTEXT}'
omit = []

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
show_contexts = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
